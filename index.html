<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tes Kecocokan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:28px 16px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 10% 15%,#ffd0e3 0 4%,transparent 4.3%),radial-gradient(circle at 90% 80%,#ffc5dc 0 5%,transparent 5.3%),linear-gradient(135deg,#ffe8f1,#ffc8df);font-family:Nunito,sans-serif;color:#7c3154}.card{position:relative;z-index:1;width:min(620px,100%);padding:42px 45px;text-align:center;background:#fffffff0;border:1px solid #fff;border-radius:28px;box-shadow:0 18px 50px #ba306738}.eyebrow{margin:0;color:#f54f91;font-size:.75rem;font-weight:800;letter-spacing:.18em}h1{margin:8px 0;font:400 clamp(1.8rem,5vw,2.6rem)/1.35 Pacifico,cursive}h1 span,.mini-heart,#pair span,button span{color:#f54f91}.intro{margin:0 0 27px}.names{display:flex;align-items:end;gap:12px;text-align:left}label{flex:1}label span{display:block;margin:0 0 7px 4px;font-size:.8rem;font-weight:800}input{width:100%;padding:13px 14px;border:2px solid #ffc5dc;border-radius:14px;outline:0;background:#fff8fb;font:inherit;color:#7c3154}input:focus{border-color:#f54f91;box-shadow:0 0 0 4px #ffd6e7}.mini-heart{font-size:1.5rem;line-height:48px}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#fa74a9,#df286f);box-shadow:0 8px 17px #e95d9445;cursor:pointer;font:800 1rem Nunito}button span{color:#ffe6f0}.result{margin-top:30px;padding-top:21px;border-top:1px dashed #f5aac9;animation:show .4s ease-out}.result p{margin:0 0 12px;font-weight:800}.heart{position:relative;width:210px;height:175px;margin:auto}.shape{position:absolute;top:25px;left:40px;width:130px;height:130px;transform:rotate(-45deg);background:linear-gradient(145deg,#ff94bd,#df286f)}.shape:before,.shape:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:inherit}.shape:before{top:-65px}.shape:after{left:65px}.score{position:absolute;z-index:1;top:62px;left:50%;transform:translateX(-50%);color:#fff;font-size:3.25rem;text-shadow:0 2px 4px #a71e5660}.score small{font-size:1.4rem}h2{margin:0;color:#df286f;font-size:1.08rem}.float{position:fixed;color:#ef5792;font-size:2rem;opacity:.5;animation:float 6s ease-in-out infinite}.float:nth-of-type(1){top:8%;left:6%}.float:nth-of-type(2){top:75%;left:10%;animation-delay:-2s}.float:nth-of-type(3){top:10%;right:9%;animation-delay:-4s}.float:nth-of-type(4){top:70%;right:6%;animation-delay:-1s}@keyframes float{50%{transform:translateY(-15px) rotate(15deg)}}@keyframes show{from{opacity:0;transform:translateY(10px)}}@media(max-width:500px){.card{padding:34px 22px}.names{flex-direction:column;align-items:stretch;gap:7px}.mini-heart{text-align:center;line-height:18px;transform:rotate(90deg)}}
  </style>
</head>
<body>
  <i class="float">♥</i><i class="float">♥</i><i class="float">♥</i><i class="float">♥</i>
  <main class="card"><p class="eyebrow">TES KECOCOKAN</p><h1>Cek kecocokan kalian <span>♥</span></h1><p class="intro">Masukkan dua nama dan lihat kecocokan kalian.</p>
    <form id="form"><div class="names"><label><span>Nama pertama</span><input id="one" placeholder="Contoh: Aulia" maxlength="50" required></label><b class="mini-heart">♥</b><label><span>Nama kedua</span><input id="two" placeholder="Contoh: Bima" maxlength="50" required></label></div><button>Hitung cinta kita <span>♥</span></button></form>
    <section class="result" id="result" hidden><p id="pair"></p><div class="heart"><div class="shape"></div><strong class="score"><span id="score"></span><small>%</small></strong></div><h2 id="message"></h2></section>
  </main>
  <script>
    const a=new Set(['fashya','sya','jovita','jovita fashya islami']),b=new Set(['yon','leon','le','kwan zou tze leon','kwan zou','tze leon','zou leon']);
    const clean=x=>x.trim().toLocaleLowerCase('id').replace(/\s+/g,' '),hash=x=>{let n=0;for(const c of x)n=((n<<5)-n+c.charCodeAt(0))|0;return Math.abs(n)};
    document.querySelector('#form').onsubmit=e=>{e.preventDefault();const x=document.querySelector('#one').value.trim(),y=document.querySelector('#two').value.trim(),p=clean(x),q=clean(y),score=(a.has(p)&&b.has(q))||(a.has(q)&&b.has(p))?100:35+hash([p,q].sort().join('|'))%66;document.querySelector('#pair').textContent=x+' ♥ '+y;document.querySelector('#score').textContent=score;document.querySelector('#message').textContent=score>=90?'Pasangan serasi banget!':score>=75?'Ada chemistry yang manis nih.':score>=55?'Cocok untuk saling mengenal lebih dekat.':'Tetap semangat, kecocokan bisa tumbuh kok.';document.querySelector('#result').hidden=false};
  </script>
</body>
</html>
